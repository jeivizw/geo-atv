name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Instalar Dependências NPM
        run: npm ci

      - name: 4. Gerar Build de Produção do React
        run: npm run build

      - name: 5. Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: 6. Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 7. Dar permissão de execução ao Gradle
        run: chmod +x android/gradlew

      - name: 8. Compilar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 9. Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: SafeWalk-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk